<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>SoulsFormats WASM Test</title>
</head>
<body>
    <h1>SoulsFormats in Browser</h1>
    <div id="output">Loading...</div>
    <script type="module">
        import { dotnet } from './_framework/dotnet.js';

        async function run() {
            try {
                const { getAssemblyExports, getConfig } = await dotnet
                    .withDiagnosticTracing(false)
                    .create();
                
                const config = getConfig();
                const exports = await getAssemblyExports(config.mainAssemblyName);
                
                const outputDiv = document.getElementById('output');
                outputDiv.innerText = "Loaded! TestExport: " + exports.JSInterop.TestExport();

                // Example: checking if an empty array is BND4 (should be false)
                const isBnd4 = exports.JSInterop.IsBND4(new Uint8Array([0, 0, 0, 0]));
                outputDiv.innerText += "\nIs [0,0,0,0] BND4? " + isBnd4;
                
            } catch (err) {
                console.error(err);
                document.getElementById('output').innerText = "Error: " + err.message;
            }
        }
        run();
    </script>
</body>
</html>
